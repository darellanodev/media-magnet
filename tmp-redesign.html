<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>getmedia — yt-dlp layout</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-void: #0a0f0d;
            --bg-page: #060908;
            --bg-panel: #101613;
            --bg-inset: #0c1210;
            --bg-chip: #141c19;
            --accent-mint: #3ddc97;
            --accent-mint-dim: #235c46;
            --accent-amber: #f2a65a;
            --text-primary: #e7f3ee;
            --text-muted: #5f7a71;
            --text-dim: #3c4f49;
            --border: #1e2b26;
            --border-soft: #16211d;
            --radius: 3px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-page);
            background-image:
                radial-gradient(circle at 15% 0%, rgba(61, 220, 151, 0.05), transparent 45%),
                repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.012) 0px, rgba(255, 255, 255, 0.012) 1px, transparent 1px, transparent 3px);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .app-window {
            width: 100%;
            max-width: 860px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(61, 220, 151, 0.03);
        }

        /* ---------- Titlebar ---------- */
        .titlebar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 18px;
            background: linear-gradient(180deg, #131b17, #0f1512);
            border-bottom: 1px solid var(--border);
        }

        .titlebar-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .dots {
            display: flex;
            gap: 6px;
        }

        .dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #242f2a;
        }

        .dots span:nth-child(1) {
            background: #4a3030;
        }

        .dots span:nth-child(2) {
            background: #4a4530;
        }

        .dots span:nth-child(3) {
            background: #2e4a35;
        }

        .wordmark {
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.02em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .wordmark .prompt-caret {
            color: var(--accent-mint);
        }

        .wordmark .tool-tag {
            font-size: 10px;
            font-weight: 600;
            color: var(--bg-void);
            background: var(--accent-mint);
            padding: 2px 6px;
            border-radius: 3px;
            letter-spacing: 0.06em;
        }

        /* tool switcher — yt-dlp / ok.ru */
        .tool-switch {
            display: flex;
            gap: 6px;
        }

        .tool-switch button {
            appearance: none;
            border: 1px solid var(--border);
            background: var(--bg-inset);
            color: var(--text-dim);
            font-family: inherit;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.06em;
            padding: 4px 10px;
            border-radius: 3px;
            cursor: pointer;
            transition: all .15s ease;
        }

        .tool-switch button:hover:not(.active) {
            color: var(--text-muted);
            border-color: #2a3a34;
        }

        .tool-switch button.active {
            background: var(--accent-mint);
            border-color: var(--accent-mint);
            color: var(--bg-void);
        }

        /* mode toggle (single/playlist) — compact pill, lives in titlebar now */
        .mode-toggle {
            display: flex;
            background: var(--bg-inset);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3px;
            gap: 2px;
        }

        .mode-toggle button {
            appearance: none;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            padding: 5px 12px;
            border-radius: 16px;
            cursor: pointer;
            transition: all .15s ease;
        }

        .mode-toggle button.active {
            background: var(--accent-mint);
            color: var(--bg-void);
        }

        .mode-toggle button:not(.active):hover {
            color: var(--text-primary);
        }

        /* ---------- Body ---------- */
        .body {
            padding: 26px 26px 22px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .section-label {
            display: flex;
            align-items: baseline;
            gap: 8px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .section-label::before {
            content: "$";
            color: var(--accent-mint);
            font-weight: 700;
        }

        .section-label .hint {
            text-transform: none;
            letter-spacing: normal;
            font-weight: 400;
            color: var(--text-dim);
            font-size: 10.5px;
        }

        /* ---------- Flags grid ---------- */
        .flags-grid {
            display: grid;
            grid-template-columns: 1.1fr 1fr 1fr;
            gap: 0;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .flag-group {
            padding: 14px 16px;
            border-right: 1px solid var(--border-soft);
            background: var(--bg-inset);
        }

        .flag-group:last-child {
            border-right: none;
        }

        .flag-group h4 {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .chip-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .chip {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12.5px;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px 4px 6px;
            border-radius: 4px;
            transition: background .12s ease, color .12s ease;
            user-select: none;
        }

        .chip:hover {
            background: rgba(61, 220, 151, 0.05);
            color: var(--text-primary);
        }

        .chip .box {
            width: 13px;
            height: 13px;
            border: 1.5px solid var(--text-dim);
            border-radius: 3px;
            flex-shrink: 0;
            position: relative;
            transition: border-color .12s ease;
        }

        .chip.radio .box {
            border-radius: 50%;
        }

        .chip.selected {
            color: var(--text-primary);
        }

        .chip.selected .box {
            border-color: var(--accent-mint);
            background: rgba(61, 220, 151, 0.08);
        }

        .chip.selected .box::after {
            content: "";
            position: absolute;
            inset: 2.5px;
            border-radius: inherit;
            background: var(--accent-mint);
        }

        .chip .flag-code {
            margin-left: auto;
            font-size: 10px;
            color: var(--text-dim);
            opacity: 0;
            transition: opacity .12s ease;
        }

        .chip.selected .flag-code {
            opacity: 1;
            color: var(--accent-mint);
        }

        /* ---------- URL row ---------- */
        .url-row {
            display: flex;
            align-items: stretch;
            gap: 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-inset);
            padding: 4px;
        }

        .url-row .caret {
            display: flex;
            align-items: center;
            padding: 0 10px;
            color: var(--accent-mint);
            font-weight: 700;
            font-size: 14px;
        }

        .url-row input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 13px;
            padding: 10px 4px;
        }

        .url-row input::placeholder {
            color: var(--text-dim);
        }

        .add-btn {
            appearance: none;
            border: none;
            background: var(--accent-mint);
            color: var(--bg-void);
            font-family: inherit;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.04em;
            padding: 0 20px;
            border-radius: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform .1s ease, background .15s ease;
        }

        .add-btn:hover {
            background: #54e5ad;
        }

        .add-btn:active {
            transform: scale(0.97);
        }

        /* ---------- Preview / result console ---------- */
        .console {
            background: var(--bg-void);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
            min-height: 76px;
        }

        .console-line {
            font-size: 12.5px;
            line-height: 1.7;
            color: var(--accent-mint);
            word-break: break-all;
        }

        .console-line .flag {
            color: var(--accent-amber);
        }

        .console-line .muted {
            color: var(--text-muted);
        }

        .cursor {
            display: inline-block;
            width: 7px;
            height: 14px;
            background: var(--accent-mint);
            margin-left: 2px;
            vertical-align: -2px;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* footer note */
        .footnote {
            font-size: 10.5px;
            color: var(--text-dim);
            text-align: center;
            margin-top: 2px;
        }

        @media (max-width: 640px) {
            .flags-grid {
                grid-template-columns: 1fr;
            }

            .flag-group {
                border-right: none;
                border-bottom: 1px solid var(--border-soft);
            }

            .flag-group:last-child {
                border-bottom: none;
            }

            .titlebar {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <div class="app-window">

        <div class="titlebar">
            <div class="titlebar-left">
                <div class="dots"><span></span><span></span><span></span></div>
                <div class="wordmark"><span class="prompt-caret">›_</span> media-magnet</div>
                <div class="tool-switch" id="toolSwitch">
                    <button class="active" data-tool="ytdlp">yt-dlp</button>
                    <button data-tool="okru">ok.ru</button>
                </div>
            </div>
            <div class="mode-toggle" id="modeToggle">
                <button class="active" data-mode="single">single</button>
                <button data-mode="playlist">playlist</button>
            </div>
        </div>

        <div class="body">

            <div>
                <div class="section-label">configure <span class="hint">// choose type, quality and extras</span></div>
                <div class="flags-grid">

                    <div class="flag-group">
                        <h4>Media type</h4>
                        <div class="chip-list" data-group="media" data-exclusive="true">
                            <div class="chip radio selected" data-value="video" data-code="-f mp4"><span
                                    class="box"></span>Video <span class="flag-code">-f mp4</span></div>
                            <div class="chip radio" data-value="audio" data-code="-x --audio-format mp3"><span
                                    class="box"></span>Audio <span class="flag-code">-x mp3</span></div>
                        </div>
                    </div>

                    <div class="flag-group">
                        <h4>Quality</h4>
                        <div class="chip-list" data-group="quality" data-exclusive="true">
                            <div class="chip radio selected" data-value="1080p" data-code="height<=1080"><span
                                    class="box"></span>1080p <span class="flag-code">≤1080</span></div>
                            <div class="chip radio" data-value="720p" data-code="height<=720"><span
                                    class="box"></span>720p <span class="flag-code">≤720</span></div>
                            <div class="chip radio" data-value="480p" data-code="height<=480"><span
                                    class="box"></span>480p <span class="flag-code">≤480</span></div>
                        </div>
                    </div>

                    <div class="flag-group">
                        <h4>Options</h4>
                        <div class="chip-list" data-group="options">
                            <div class="chip" data-value="cookies" data-code="--cookies-from-browser"><span
                                    class="box"></span>Cookies from browser <span class="flag-code">✓</span></div>
                        </div>
                    </div>

                </div>
            </div>

            <div>
                <div class="section-label">target <span class="hint">// paste the URL to download</span></div>
                <div class="url-row">
                    <span class="caret">›</span>
                    <input id="urlInput" type="text" placeholder="https://youtube.com/watch?v=..." />
                    <button class="add-btn" id="addBtn">Add it →</button>
                </div>
            </div>

            <div>
                <div class="section-label">preview <span class="hint">// command that will run in yt-dlp</span></div>
                <div class="console">
                    <div class="console-line" id="previewLine"></div>
                </div>
            </div>

        </div>
    </div>

    <p class="footnote"
        style="color:#3c4f49; margin-top:14px; text-align:center; font-family:'JetBrains Mono',monospace;">layout mockup
        — no real download logic</p>

    <script>
        const state = { mode: 'single', media: 'video', quality: '1080p', options: new Set() };

        function q(sel, root = document) { return root.querySelector(sel); }
        function qa(sel, root = document) { return [...root.querySelectorAll(sel)]; }

        // tool switch (yt-dlp / ok.ru) — visual only, ok.ru layout not built yet
        qa('#toolSwitch button').forEach(btn => {
            btn.addEventListener('click', () => {
                qa('#toolSwitch button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (btn.dataset.tool === 'okru') {
                    q('#previewLine').innerHTML = '<span class="muted">// ok.ru layout coming soon</span><span class="cursor"></span>';
                } else {
                    render();
                }
            });
        });

        // mode toggle
        qa('#modeToggle button').forEach(btn => {
            btn.addEventListener('click', () => {
                qa('#modeToggle button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.mode = btn.dataset.mode;
                render();
            });
        });

        // exclusive groups (radio-like)
        qa('.chip-list[data-exclusive="true"]').forEach(list => {
            qa('.chip', list).forEach(chip => {
                chip.addEventListener('click', () => {
                    qa('.chip', list).forEach(c => c.classList.remove('selected'));
                    chip.classList.add('selected');
                    state[list.dataset.group] = chip.dataset.value;
                    render();
                });
            });
        });

        // options (checkbox-like, non exclusive)
        qa('.chip-list:not([data-exclusive]) .chip').forEach(chip => {
            chip.addEventListener('click', () => {
                chip.classList.toggle('selected');
                if (chip.classList.contains('selected')) state.options.add(chip.dataset.value);
                else state.options.delete(chip.dataset.value);
                render();
            });
        });

        const urlInput = q('#urlInput');
        urlInput.addEventListener('input', render);

        q('#addBtn').addEventListener('click', () => {
            if (!urlInput.value.trim()) { urlInput.focus(); return; }
            urlInput.value = '';
            render();
        });

        function render() {
            const url = urlInput.value.trim() || '<url>';
            let cmd = `yt-dlp `;
            let parts = [];

            if (state.mode === 'single') parts.push(`<span class="flag">--no-playlist</span>`);
            else parts.push(`<span class="flag">--yes-playlist</span>`);

            if (state.media === 'video') {
                parts.push(`<span class="flag">-f</span> "bv*[height&lt;=${state.quality.replace('p', '')}]+ba"`);
            } else {
                parts.push(`<span class="flag">-x --audio-format</span> mp3`);
            }

            if (state.options.has('cookies')) parts.push(`<span class="flag">--cookies-from-browser</span> chrome`);

            parts.push(`<span class="muted">${url}</span>`);

            q('#previewLine').innerHTML = cmd + parts.join(' ') + '<span class="cursor"></span>';
        }

        render();
    </script>

</body>

</html>
